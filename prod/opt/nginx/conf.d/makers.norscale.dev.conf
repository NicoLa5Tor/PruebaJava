# Only reachable through the Cloudflare tunnel (no published ports). Cloudflare terminates TLS and sends the
# visitor's address in CF-Connecting-IP, which is used for rate limiting and forwarded to the app.

map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Password sign-in: 10 per minute per visitor (the API adds per-account limits on top).
limit_req_zone $client_ip zone=auth:10m rate=10r/m;
# Rest of the API: generous, only stops floods.
limit_req_zone $client_ip zone=api:10m rate=30r/s;
limit_req_status 429;

upstream makers_frontend {
    server makers-frontend:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name makers.norscale.dev;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /api/v1/auth/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://makers_frontend;
    }

    # Server-sent events: no buffering and long reads so status changes reach the browser immediately.
    location = /api/v1/loans/me/events {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
        proxy_pass http://makers_frontend;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://makers_frontend;
    }

    # Hashed bundles never change; let Cloudflare and browsers keep them.
    location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://makers_frontend;
    }

    location / {
        proxy_pass http://makers_frontend;
    }
}
