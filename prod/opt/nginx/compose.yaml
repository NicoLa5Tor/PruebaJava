# Reverse proxy between the Cloudflare tunnel and the frontend: rate limits, gzip, SSE settings.
# No published ports in production; compose.local.yaml publishes one for testing on a workstation.
name: makers-nginx

services:
  nginx:
    image: nginx:1.29-alpine
    container_name: makers-nginx
    restart: unless-stopped
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [makers]

networks:
  makers:
    name: makers
    external: true
