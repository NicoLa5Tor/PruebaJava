spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backend}
    username: ${DB_USERNAME:backend}
    password: ${DB_PASSWORD:backend}
  jpa:
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks the mappings match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Databases created before Flyway (by ddl-auto) are adopted as V1 and then migrated forward.
    baseline-on-migrate: true
    baseline-version: 1
  cache:
    type: jcache
    jcache:
      provider: org.ehcache.jsr107.EhcacheCachingProvider
      config: classpath:ehcache.xml
  mvc:
    async:
      # Server-sent event streams stay open; the client reconnects when this expires.
      request-timeout: 30m

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

auth:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
  logto:
    issuer: ${LOGTO_ISSUER}
    app-id: ${LOGTO_APP_ID}
  refresh-cookie:
    name: refresh_token
    path: /api/v1/auth
    # Browsers accept Secure cookies on http://localhost; only disable this if you test over plain HTTP on another host.
    secure: ${AUTH_COOKIE_SECURE:true}

app:
  seed:
    super-admin-email: ${ADMIN_EMAIL:nico.rodriguez.torres.71@gmail.com}
    # Optional: lets the super admin also sign in with email and password, not only through Logto.
    super-admin-password: ${SUPER_ADMIN_PASSWORD:}
    # Creates usuario@test.com, admin@test.com and superadmin@test.com (password 123). Disable outside demos.
    demo-users: ${SEED_DEMO_USERS:true}
