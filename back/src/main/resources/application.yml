spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backend}
    username: ${DB_USERNAME:backend}
    password: ${DB_PASSWORD:backend}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

auth:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
  logto:
    issuer: ${LOGTO_ISSUER}
    app-id: ${LOGTO_APP_ID}
  refresh-cookie:
    name: refresh_token
    path: /api/v1/auth
    # Browsers accept Secure cookies on http://localhost; only disable this if you test over plain HTTP on another host.
    secure: ${AUTH_COOKIE_SECURE:true}
  admin-email: ${ADMIN_EMAIL:nico.rodriguez.torres.71@gmail.com}
